<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizim Dünya Turumuz ❤️</title>
    <style>
        :root {
            --primary-color: #ff4b2b;
            --secondary-color: #ff416c;
            --bg-color: #0f172a;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Şifre Ekranı */
        #login-screen {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(255, 75, 43, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }

        #login-screen h2 {
            margin-bottom: 1.5rem;
            color: #ff758c;
        }

        input[type="password"] {
            width: 80%;
            padding: 12px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 25px;
            text-align: center;
            font-size: 1.2rem;
            outline: none;
        }

        button {
            background: linear-gradient(to right, var(--secondary-color), var(--primary-color));
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
        }

        .error-msg {
            color: #ff4d4d;
            margin-top: 10px;
            font-size: 0.9rem;
            display: none;
        }

        /* Ana İçerik Ekranı */
        #main-content {
            display: none;
            width: 100%;
            max-width: 900px;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            color: #ff758c;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .destinations {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .card-content h3 {
            margin: 0 0 10px 0;
            color: #ff758c;
        }

        .card-content p {
            font-size: 0.95rem;
            line-height: 1.4;
            color: #ddd;
        }

        /* Arka Plan Kalp Efekti */
        .heart {
            position: fixed;
            font-size: 1.5rem;
            color: rgba(255, 65, 108, 0.6);
            animation: float 6s linear infinite;
            z-index: -1;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>❤️ Özel
